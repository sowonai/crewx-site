name: Sync download page with latest Desktop release

# Keeps /download pointing at the newest verified Windows installer.
# Runs on a schedule, by hand, or when sowonlabs/crewx sends
# `repository_dispatch` (event type: desktop-release) after publishing.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [desktop-release]

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-download
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find newer Desktop releases
        id: find
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tags="$(node scripts/find-newer-release.mjs)"
          echo "tags=$(echo $tags)" >> "$GITHUB_OUTPUT"
          echo "newer: ${tags:-none}"

      - name: Verify installer bytes and update manifest
        if: steps.find.outputs.tags != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in ${{ steps.find.outputs.tags }}; do
            node scripts/generate-release-manifest.mjs --tag "$tag"
          done
          node --test scripts/verify-release-manifest.mjs

      - name: Commit and deploy
        if: steps.find.outputs.tags != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --quiet data/download-manifest.json && { echo "manifest unchanged"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/download-manifest.json
          git commit -m "release(site): link verified Windows ${{ steps.find.outputs.tags }} installer"
          git push origin HEAD:main
          # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy explicitly.
          gh workflow run deploy.yml --ref main
